name: Pull request checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  dependency-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/dependencies.cjs').checkPullRequest({github, context, core});
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test .github/scripts/dependencies.test.cjs
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --select E4,E7,E9,F app/analytics.py app/api.py app/assistant.py app/config.py app/observability.py app/ui.py tests scripts/measure_player_directory.py
      - run: python -m pytest -q
