name: Issue dependencies
on:
  issues:
    types: [opened, edited, closed, reopened, assigned, unassigned]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: issue-dependencies
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/dependencies.cjs').synchronize({github, context});
