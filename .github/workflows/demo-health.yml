name: Demo health
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Set the repository variable DEMO_URL (https://...) after publishing.
    if: vars.DEMO_URL != ''
    runs-on: ubuntu-latest
    steps:
      - name: Demo answers over HTTPS
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          case "$DEMO_URL" in https://*) ;; *) echo "DEMO_URL must use HTTPS"; exit 1 ;; esac
          # Retries cover a free host that needs about a minute to wake up.
          test "$(curl -fsS --retry 8 --retry-delay 15 --retry-all-errors --max-time 90 "${DEMO_URL%/}/_stcore/health")" = ok
